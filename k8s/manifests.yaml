apiVersion: v1
kind: Namespace
metadata:
  name: minipay
---
apiVersion: v1
kind: Secret
metadata:
  name: minipay-db-secret
  namespace: minipay
type: Opaque
stringData:
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgrespassword
  POSTGRES_DB: minipay
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: minipay-config
  namespace: minipay
data:
  DB_HOST: minipay-db-service
  DB_PORT: "5432"
  APP_ENV: production
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minipay-db
  namespace: minipay
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minipay-db
  template:
    metadata:
      labels:
        app: minipay-db
    spec:
      containers:
      - name: postgres
        image: postgres:15-alpine
        ports:
        - containerPort: 5432
        envFrom:
        - secretRef:
            name: minipay-db-secret
---
apiVersion: v1
kind: Service
metadata:
  name: minipay-db-service
  namespace: minipay
spec:
  selector:
    app: minipay-db
  ports:
  - protocol: TCP
    port: 5432
    targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minipay-api
  namespace: minipay
spec:
  replicas: 2
  selector:
    matchLabels:
      app: minipay-api
  template:
    metadata:
      labels:
        app: minipay-api
    spec:
      containers:
      - name: api
        image: hashicorp/http-echo:latest
        args:
        - "-text=MiniPay API is Healthy"
        ports:
        - containerPort: 5678
        readinessProbe:
          httpGet:
            path: /
            port: 5678
          initialDelaySeconds: 3
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /
            port: 5678
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: minipay-api-service
  namespace: minipay
spec:
  type: NodePort
  selector:
    app: minipay-api
  ports:
  - protocol: TCP
    port: 80
    targetPort: 5678
    nodePort: 30080
